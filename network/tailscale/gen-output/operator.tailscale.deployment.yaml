apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: operator
    spec:
      containers:
      - env:
        - name: OPERATOR_INITIAL_TAGS
          value: tag:k8s-operator
        - name: OPERATOR_HOSTNAME
          value: tailscale-operator
        - name: OPERATOR_SECRET
          value: operator
        - name: OPERATOR_LOGGING
          value: info
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPERATOR_LOGIN_SERVER
          value: null
        - name: OPERATOR_INGRESS_CLASS_NAME
          value: tailscale
        - name: CLIENT_ID
          value: TUipAUqT7c11CNTRL-keHowLsa2x11CNTRL
        - name: PROXY_IMAGE
          value: tailscale/tailscale:v1.94.2
        - name: PROXY_TAGS
          value: tag:k8s
        - name: APISERVER_PROXY
          value: noauth
        - name: PROXY_FIREWALL_MODE
          value: auto
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: tailscale/k8s-operator:v1.94.2
        imagePullPolicy: Always
        name: operator
        volumeMounts:
        - mountPath: /var/run/secrets/tailscale/serviceaccount
          name: oidc-jwt
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: operator
      volumes:
      - name: oidc-jwt
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: api.tailscale.com/TUipAUqT7c11CNTRL-keHowLsa2x11CNTRL
              expirationSeconds: 3600
              path: token
